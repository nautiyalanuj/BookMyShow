spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookmyshow}
    username: ${DB_USER:bookmyshow}
    password: ${DB_PASSWORD:bookmyshow}
    hikari:
      connection-timeout: 3000
      connection-init-sql: SET statement_timeout = '5s'
  jdbc:
    template:
      query-timeout: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  mvc:
    problemdetails:
      enabled: true
booking:
  lock-ttl: ${BOOKING_LOCK_TTL:10s}
